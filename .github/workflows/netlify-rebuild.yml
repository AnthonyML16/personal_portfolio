name: Rebuild diario en Netlify

# Reconstruye el sitio cada día para actualizar la actividad de GitHub,
# que se obtiene en tiempo de build.
on:
  schedule:
    - cron: "0 6 * * *" # todos los días a las 06:00 UTC
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar build hook de Netlify
        run: curl -fsS -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"
